<div id="overlay"><div class="intro"><div class="eyebrow">WELCOME TO YOUR CAMPUS</div><h2>오늘은<br><span style="color:#67e8f9">부수는 날.</span></h2><p>작은 3D 캠퍼스를 마음껏 파괴해 보세요.<br>도구를 바꾸고 최고 점수에 도전하세요.</p><button class="start" id="start">게임 시작하기 →</button><p class="small">가상의 캠퍼스를 사용하는 팬메이드 미니 게임입니다.</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* -------------------------------------------------------
   SMASH — scene, buildings, effects, input and audio
------------------------------------------------------- */
const host = document.querySelector('#game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc8df);
scene.fog = new THREE.Fog(0x9bc8df, 45, 110);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f6ff, 0x54665d, 2));
const sunlight = new THREE.DirectionalLight(0xfff0d4, 3);
sunlight.position.set(-25, 42, 18);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(2048, 2048);
sunlight.shadow.camera.left = -45;
sunlight.shadow.camera.right = 45;
sunlight.shadow.camera.top = 45;
sunlight.shadow.camera.bottom = -45;
scene.add(sunlight);

const mat = (color, roughness = 0.82) =>
  new THREE.MeshStandardMaterial({ color, roughness });

function addBox(parent, width, height, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function disposeTree(object) {
  object.traverse(child => {
    if (!child.isMesh && !child.isLine) return;
    child.geometry?.dispose();
    if (Array.isArray(child.material)) {
      child.material.forEach(m => m.dispose());
    } else {
      child.material?.dispose();
    }
  });
}

function addGround() {
  addBox(scene, 140, 0.1, 140, mat(0x73966b), 0, -0.15, 0);
  addBox(scene, 100, 0.08, 10, mat(0x444e5a), 0, -0.04, 0);
  addBox(scene, 10, 0.08, 90, mat(0x444e5a), 0, -0.02, 0);
  addBox(scene, 56, 0.08, 3, mat(0xb6b9b0), 0, 0, 13);
  addBox(scene, 3, 0.08, 46, mat(0xb6b9b0), -14, 0, 0);
  addBox(scene, 38, 0.08, 3, mat(0xb6b9b0), 13, 0, -14);

  for (let i = -45; i <= 45; i += 4) {
    addBox(scene, 1.5, 0.012, 0.12, mat(0xe6e6db), i, 0.02, 0);
    addBox(scene, 0.12, 0.012, 1.5, mat(0xe6e6db), 0, 0.02, i);
  }

  const treePositions = [
    [-20, -20], [-24, -12], [-21, 8], [-20, 18],
    [20, -20], [25, -10], [22, 8], [20, 18],
    [8, 24], [-7, 24], [27, 22], [-28, 25]
  ];
  treePositions.forEach(([x, z]) => {
    const tree = new THREE.Group();
    tree.position.set(x, 0, z);
    scene.add(tree);
    addBox(tree, 0.3, 1.5, 0.3, mat(0x6b4d35), 0, 0.75, 0);
    const crown = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1, 1),
      mat(0x397657)
    );
    crown.position.y = 1.8;
    crown.castShadow = true;
    tree.add(crown);
  });
}
addGround();

const buildingNames = [
  '중앙 도서관', '학생회관', '공학관 A', '본관',
  '강의동', '체육관', '과학관', '기숙사'
];
const buildingPlaces = [
  [-8, -9, 7, 6, 9], [7, -10, 8, 6, 13],
  [18, -7, 7, 6, 7], [-22, -5, 7, 7, 6],
  [-8, 7, 8, 6, 11], [7, 8, 7, 7, 8],
  [20, 9, 8, 7, 12], [-24, 15, 7, 6, 9],
  [-5, -23, 10, 7, 10], [10, -24, 7, 6, 6],
  [26, -23, 6, 7, 8], [0, 25, 9, 6, 7]
];
const buildingColors = [
  0xd7dce1, 0xc8d2d8, 0xe4d6c4, 0xc3d0c7,
  0xd8c5ba, 0xbfcbd8, 0xe0dfe1
];

let buildings = [];
let rubble = [];
let particles = [];
let transients = [];
let actions = [];
let score = 0;
let destroyed = 0;
let selectedTool = 'bomb';
let effectScale = 1;
let gameStarted = false;

const scoreDisplay = document.querySelector('#score');
const destroyedDisplay = document.querySelector('#destroyed');
const toastBox = document.querySelector('#toast');
function toast(message) {
  toastBox.textContent = message;
  toastBox.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toastBox.classList.remove('show'), 1500);
}

function createBuilding(data, index) {
  const [x, z, width, depth, height] = data;
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);

  const color = buildingColors[index % buildingColors.length];
  const floors = Math.max(2, Math.floor(height / 1.15));
  addBox(group, width, height, depth, mat(color), 0, height / 2, 0);

  const windowMaterial = mat(0x4e7187, 0.35);
  const columns = Math.max(2, Math.floor(width / 1.25));
  const rows = Math.max(1, Math.floor(depth / 1.7));
  for (let floor = 0; floor < floors; floor++) {
    const y = 0.65 + floor * (height - 0.8) / floors;
    const xStep = width / columns;
    for (let column = 0; column < columns; column++) {
      const wx = -width / 2 + xStep * (column + 0.5);
      addBox(group, 0.48, 0.38, 0.05, windowMaterial.clone(), wx, y, depth / 2 + 0.03);
      addBox(group, 0.48, 0.38, 0.05, windowMaterial.clone(), wx, y, -depth / 2 - 0.03);
    }
    const zStep = depth / rows;
    for (let row = 0; row < rows; row++) {
      const wz = -depth / 2 + zStep * (row + 0.5);
      addBox(group, 0.05, 0.38, 0.48, windowMaterial.clone(), width / 2 + 0.03, y, wz);
      addBox(group, 0.05, 0.38, 0.48, windowMaterial.clone(), -width / 2 - 0.03, y, wz);
    }
  }
  windowMaterial.dispose();

  addBox(group, width + 0.12, 0.22, depth + 0.12,
    mat(index % 3 === 0 ? 0x596875 : 0x777f87), 0, height + 0.1, 0);
  addBox(group, 1.05, 1.7, 0.08, mat(0x384b58), 0, 0.85, depth / 2 + 0.06);

  const building = {
    group, name: buildingNames[index % buildingNames.length],
    x, z, width, depth, height, color, alive: true, pending: false
  };
  group.userData.building = building;
  buildings.push(building);
}

function resetCampus() {
  actions.forEach(removeAction);
  actions = [];
  rubble.forEach(item => {
    scene.remove(item.mesh);
    disposeTree(item.mesh);
  });
  rubble = [];
  particles.forEach(item => {
    scene.remove(item.mesh);
    disposeTree(item.mesh);
  });
  particles = [];
  transients.forEach(item => {
    scene.remove(item.mesh);
    disposeTree(item.mesh);
  });
  transients = [];
  buildings.forEach(building => {
    scene.remove(building.group);
    disposeTree(building.group);
  });
  buildings = [];
  buildingPlaces.forEach(createBuilding);
  score = 0;
  destroyed = 0;
  scoreDisplay.textContent = '000000';
  destroyedDisplay.textContent = '0';
  toast('캠퍼스가 복구되었습니다');
}
buildingPlaces.forEach(createBuilding);

/* --------------------- Sound --------------------- */
let audioContext = null;
let masterVolume = null;
let soundEnabled = true;

function initializeAudio() {
  if (!audioContext) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioContext = new AudioContextClass();
    masterVolume = audioContext.createGain();
    masterVolume.gain.value = soundEnabled ? 0.7 : 0;
    masterVolume.connect(audioContext.destination);
  }
  if (audioContext.state === 'suspended') audioContext.resume();
}

function tone(startHz, endHz, duration, type = 'sine', volume = 0.15) {
  if (!soundEnabled || !audioContext || !masterVolume) return;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const now = audioContext.currentTime;
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(Math.max(1, startHz), now);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endHz), now + duration);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  oscillator.connect(gain);
  gain.connect(masterVolume);
  oscillator.start(now);
  oscillator.stop(now + duration + 0.02);
}

function noise(duration, volume = 0.2, filterType = 'lowpass', cutoff = 800) {
  if (!soundEnabled || !audioContext || !masterVolume) return;
  const length = Math.max(1, Math.floor(audioContext.sampleRate * duration));
  const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;

  const source = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const gain = audioContext.createGain();
  const now = audioContext.currentTime;
  source.buffer = buffer;
  filter.type = filterType;
  filter.frequency.setValueAtTime(cutoff, now);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterVolume);
  source.start(now);
  source.stop(now + duration);
}

function playStartSound(tool) {
  initializeAudio();
  switch (tool) {
    case 'meteor':
      tone(420, 55, 1.05, 'sawtooth', 0.12);
      noise(0.95, 0.12, 'highpass', 900);
      break;
    case 'bomb':
      tone(125, 48, 0.85, 'triangle', 0.1);
      noise(0.7, 0.12, 'lowpass', 650);
      break;
    case 'bat':
      tone(260, 90, 0.28, 'triangle', 0.12);
      noise(0.18, 0.1, 'bandpass', 650);
      break;
    case 'laser':
      tone(950, 150, 0.8, 'sawtooth', 0.09);
      break;
    case 'lightning':
      tone(220, 65, 0.75, 'triangle', 0.11);
      noise(0.45, 0.16, 'highpass', 1200);
      break;
    case 'quake':
      tone(55, 28, 1.2, 'triangle', 0.16);
      noise(1.0, 0.13, 'lowpass', 160);
      break;
    case 'blackhole':
      tone(380, 42, 1.4, 'sine', 0.12);
      tone(95, 35, 1.2, 'triangle', 0.08);
      break;
    case 'nuke':
      tone(180, 35, 1.6, 'sawtooth', 0.12);
      noise(1.0, 0.16, 'lowpass', 420);
      break;
    case 'fire':
      tone(210, 75, 0.85, 'triangle', 0.08);
      noise(0.7, 0.14, 'highpass', 700);
      break;
  }
}

function playImpactSound(tool) {
  if (!audioContext || !soundEnabled) return;
  if (tool === 'laser') {
    tone(180, 45, 0.5, 'square', 0.13);
    noise(0.22, 0.13, 'highpass', 1800);
  } else if (tool === 'bat') {
    tone(115, 48, 0.34, 'triangle', 0.2);
    noise(0.12, 0.2, 'bandpass', 500);
  } else if (tool === 'lightning') {
    noise(0.75, 0.24, 'lowpass', 500);
    tone(80, 30, 0.9, 'triangle', 0.13);
  } else if (tool === 'fire') {
    noise(0.55, 0.2, 'highpass', 1100);
    tone(95, 42, 0.45, 'sine', 0.1);
  } else {
    const duration = tool === 'nuke' ? 1.25 : tool === 'quake' ? 0.95 : 0.7;
    noise(duration, tool === 'nuke' ? 0.36 : 0.24, 'lowpass', tool === 'nuke' ? 330 : 600);
    tone(tool === 'nuke' ? 48 : 72, 24, duration, 'sine', tool === 'nuke' ? 0.28 : 0.18);
  }
}

document.querySelector('#start').addEventListener('click', () => {
  gameStarted = true;
  initializeAudio();
  document.querySelector('#overlay').classList.add('hidden');
  toast('도구를 선택하고 건물을 클릭하세요!');
});

const soundButton = document.querySelector('#soundToggle');
soundButton.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  if (masterVolume) masterVolume.gain.setTargetAtTime(
    soundEnabled ? 0.7 : 0, audioContext.currentTime, 0.04
  );
  soundButton.textContent = soundEnabled ? '🔊 사운드 ON' : '🔇 사운드 OFF';
  if (soundEnabled) initializeAudio();
});

/* ----------------- Particles and rubble ----------------- */
function addParticle(position, color, size, velocity, life = 0.8, gravity = 8) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(size, 6, 5),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 })
  );
  mesh.position.copy(position);
  scene.add(mesh);
  particles.push({ mesh, velocity: velocity.clone(), life, maxLife: life, gravity });
}

function emitSparks(position, color, count = 10, power = 5) {
  for (let i = 0; i < count; i++) {
    const velocity = new THREE.Vector3(
      (Math.random() - 0.5) * power,
      Math.random() * power * 0.8 + 1,
      (Math.random() - 0.5) * power
    );
    addParticle(position, color, 0.07 + Math.random() * 0.08, velocity, 0.6 + Math.random() * 0.6);
  }
}

function spawnRing(position, color, maxScale = 12, duration = 0.65) {
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(1, 0.075, 8, 64),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.copy(position);
  mesh.position.y = Math.max(0.12, position.y);
  scene.add(mesh);
  transients.push({ mesh, life: duration, maxLife: duration, maxScale });
}

function spawnBlast(position, color, scale = 1) {
  spawnRing(position, color, 10 * scale, 0.7);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.42 })
  );
  glow.position.copy(position);
  scene.add(glow);
  transients.push({ mesh: glow, life: 0.32, maxLife: 0.32, maxScale: 5 * scale });
}

function collapseBuilding(building, tool) {
  if (!building.alive) return;
  building.alive = false;
  building.pending = false;
  scene.remove(building.group);

  const columns = 3;
  const rows = 3;
  const layers = 2;
  const pieceWidth = building.width / columns;
  const pieceHeight = building.height / rows;
  const pieceDepth = building.depth / layers;
  const force = (tool === 'nuke' ? 12 : tool === 'meteor' ? 10 : 7) * effectScale;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < columns; x++) {
      for (let z = 0; z < layers; z++) {
        const width = pieceWidth * 0.94;
        const height = pieceHeight * 0.94;
        const depth = pieceDepth * 0.94;
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(width, height, depth),
          mat(building.color)
        );
        mesh.position.set(
          building.x - building.width / 2 + pieceWidth * (x + 0.5),
          pieceHeight * (y + 0.5),
          building.z - building.depth / 2 + pieceDepth * (z + 0.5)
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        const away = new THREE.Vector3(
          mesh.position.x - building.x + (Math.random() - 0.5) * 2,
          0,
          mesh.position.z - building.z + (Math.random() - 0.5) * 2
        ).normalize();
        rubble.push({
          mesh,
          velocity: new THREE.Vector3(
            away.x * force * (0.35 + Math.random() * 0.5),
            2 + Math.random() * force * 0.55,
            away.z * force * (0.35 + Math.random() * 0.5)
          ),
          spin: new THREE.Vector3(
            Math.random() * 6, Math.random() * 6, Math.random() * 6
          ),
          life: 2.3 + Math.random() * 1.8
        });
      }
    }
  }

  disposeTree(building.group);
  const pointsByTool = {
    bomb: 100, bat: 150, laser: 200, meteor: 300,
    lightning: 250, quake: 180, blackhole: 350, nuke: 500, fire: 220
  };
  score += pointsByTool[tool] || 100;
  destroyed += 1;
  scoreDisplay.textContent = String(score).padStart(6, '0');
  destroyedDisplay.textContent = String(destroyed);

  const center = new THREE.Vector3(building.x, building.height * 0.45, building.z);
  const color = tool === 'laser' ? 0x67e8f9 :
    tool === 'fire' ? 0xff6b22 : tool === 'meteor' ? 0xff5e43 : 0xffc16a;
  emitSparks(center, color, Math.round(12 * effectScale), 6 * effectScale);
}

function removeAction(action) {
  action.nodes.forEach(node => {
    scene.remove(node);
    disposeTree(node);
  });
  action.targets.forEach(building => {
    if (building.alive) building.pending = false;
  });
}

function addActionNode(action, node) {
  action.nodes.push(node);
  scene.add(node);
  return node;
}

function makeOrb(color, radius, glow = false) {
  return new THREE.Mesh(
    new THREE.SphereGeometry(radius, 18, 14),
    glow
      ? new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.75 })
      : mat(color, 0.55)
  );
}

function createBatVisual(action) {
  const bat = new THREE.Group();
  const handle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.16, 1.25, 10),
    mat(0x8a5732)
  );
  handle.position.y = 0.7;
  bat.add(handle);
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.16, 1.75, 12),
    mat(0xb8793f)
  );
  barrel.position.y = 2.15;
  bat.add(barrel);
  bat.position.set(action.target.x - 5, 0.5, action.target.z + 1.5);
  bat.rotation.z = -1.05;
  return addActionNode(action, bat);
}

function createLine(from, to, color, opacity = 1) {
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([from, to]),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  );
}

const TOOL_RANGE = {
  bomb: 7.5, bat: 0, laser: 0, meteor: 9,
  lightning: 4.5, quake: 11, blackhole: 12, nuke: 16, fire: 6
};
const TOOL_COLOR = {
  bomb: 0xffb45c, bat: 0xffd18b, laser: 0x67e8f9,
  meteor: 0xff603b, lightning: 0xe4f4ff, quake: 0xff9f43,
  blackhole: 0x9b5cff, nuke: 0xffd166, fire: 0xff6b22
};

function selectTargets(building, tool) {
  const range = TOOL_RANGE[tool] * effectScale;
  return buildings.filter(candidate => {
    if (!candidate.alive || candidate.pending) return false;
    if (range === 0) return candidate === building;
    return Math.hypot(candidate.x - building.x, candidate.z - building.z) <= range;
  });
}

function startAction(building, tool) {
  const targets = selectTargets(building, tool);
  if (!targets.length) return;
  targets.forEach(target => { target.pending = true; });

  const action = {
    tool, target: building, targets,
    nodes: [], elapsed: 0, duration: 1.2,
    impacted: false, waveStart: 0, waveRadius: TOOL_RANGE[tool] * effectScale
  };

  const targetPoint = new THREE.Vector3(building.x, building.height * 0.52, building.z);
  action.targetPoint = targetPoint;

  if (tool === 'meteor' || tool === 'nuke' || tool === 'bomb' || tool === 'fire') {
    const startOffset = tool === 'meteor' ? [9, 29, 7] :
      tool === 'nuke' ? [-16, 34, -12] :
      tool === 'fire' ? [-17, 8, 10] : [-11, 18, -8];
    action.startPoint = new THREE.Vector3(
      building.x + startOffset[0], startOffset[1], building.z + startOffset[2]
    );

    if (tool === 'meteor') {
      action.projectile = addActionNode(action, new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.1, 1),
        mat(0x55433b, 1)
      ));
      action.projectile.material.emissive = new THREE.Color(0x6c2815);
    } else if (tool === 'nuke') {
      const missile = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.42, 2.2, 10), mat(0x727b72)
      );
      const nose = new THREE.Mesh(
        new THREE.ConeGeometry(0.34, 0.8, 10), mat(0xc9d0b7)
      );
      nose.position.y = 1.45;
      missile.add(body, nose);
      action.projectile = addActionNode(action, missile);
    } else {
      action.projectile = addActionNode(action, makeOrb(
        tool === 'fire' ? 0xff6b22 : 0x343943,
        tool === 'fire' ? 0.85 : 0.55
      ));
    }
  }

  if (tool === 'bat') {
    action.duration = 0.78;
    action.bat = createBatVisual(action);
  } else if (tool === 'laser') {
    action.duration = 0.9;
    action.charge = addActionNode(action, makeOrb(0x67e8f9, 0.7, true));
    action.beam = addActionNode(action, createLine(
      new THREE.Vector3(building.x, 26, building.z), targetPoint, 0x67e8f9, 0
    ));
  } else if (tool === 'lightning') {
    action.duration = 0.82;
    const points = [
      new THREE.Vector3(building.x + 1.3, 25, building.z - 1),
      new THREE.Vector3(building.x - 0.7, 19, building.z + 0.8),
      new THREE.Vector3(building.x + 0.8, 13, building.z - 0.3),
      new THREE.Vector3(building.x - 0.5, 7, building.z + 0.4),
      targetPoint
    ];
    action.bolt = addActionNode(action, new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color: 0xe9f7ff, transparent: true, opacity: 0 })
    ));
  } else if (tool === 'quake') {
    action.duration = 1.65;
    action.waveRing = addActionNode(action, new THREE.Mesh(
      new THREE.TorusGeometry(1, 0.12, 8, 72),
      new THREE.MeshBasicMaterial({ color: TOOL_COLOR.quake, transparent: true, opacity: 0.9 })
    ));
    action.waveRing.rotation.x = -Math.PI / 2;
    action.waveRing.position.set(building.x, 0.18, building.z);
  } else if (tool === 'blackhole') {
    action.duration = 1.75;
    action.blackhole = addActionNode(action, makeOrb(0x140a2e, 0.9, true));
    action.blackhole.position.set(building.x, building.height + 5, building.z);
    action.ringA = addActionNode(action, new THREE.Mesh(
      new THREE.TorusGeometry(1.8, 0.08, 8, 48),
      new THREE.MeshBasicMaterial({ color: 0xb38cff, transparent: true, opacity: 0.85 })
    ));
    action.ringB = addActionNode(action, new THREE.Mesh(
      new THREE.TorusGeometry(2.5, 0.045, 8, 48),
      new THREE.MeshBasicMaterial({ color: 0x6b43d6, transparent: true, opacity: 0.7 })
    ));
    action.ringA.position.copy(action.blackhole.position);
    action.ringB.position.copy(action.blackhole.position);
    action.ringA.rotation.x = 0.9;
    action.ringB.rotation.x = 1.25;
  } else if (tool === 'nuke') {
    action.duration = 2.25;
  } else if (tool === 'fire') {
    action.duration = 1.7;
  } else {
    action.duration = 1.3;
  }

  actions.push(action);
  playStartSound(tool);
  toast(tool === 'meteor' ? '운석 낙하 시작!' :
    tool === 'nuke' ? '핵미사일 발사!' :
    tool === 'quake' ? '지진 충격파 발생!' : '공격 준비!');
}

function beginImpact(action) {
  if (action.impacted) return;
  action.impacted = true;
  action.impactTime = action.elapsed;
  playImpactSound(action.tool);
  const color = TOOL_COLOR[action.tool];
  spawnBlast(
    new THREE.Vector3(action.target.x, 0.3, action.target.z),
    color,
    action.tool === 'nuke' ? 2.1 : action.tool === 'meteor' ? 1.45 : 1
  );

  if (action.tool !== 'quake' && action.tool !== 'nuke') {
    action.targets.forEach(building => collapseBuilding(building, action.tool));
  } else {
    action.waveStart = action.elapsed;
  }
}

function updateWave(action, dt) {
  const progress = THREE.MathUtils.clamp(
    (action.elapsed - action.waveStart) / (action.tool === 'nuke' ? 0.85 : 1.0),
    0, 1
  );
  const front = action.waveRadius * progress;
  action.targets.forEach(building => {
    if (!building.alive) return;
    const distance = Math.hypot(
      building.x - action.target.x, building.z - action.target.z
    );
    if (distance <= front + 0.15) collapseBuilding(building, action.tool);
  });
}

function updateAction(action, dt) {
  action.elapsed += dt;
  const t = action.elapsed;
  const target = action.targetPoint;
  const tool = action.tool;

  if (tool === 'bomb' || tool === 'meteor' || tool === 'nuke' || tool === 'fire') {
    const flightTime = tool === 'meteor' ? 1.12 :
      tool === 'nuke' ? 1.08 : tool === 'fire' ? 0.78 : 0.92;
    const p = THREE.MathUtils.clamp(t / flightTime, 0, 1);
    const eased = tool === 'fire' ? p : p * p;
    action.projectile.position.lerpVectors(action.startPoint, target, eased);
    action.projectile.rotation.x += dt * 5;
    action.projectile.rotation.z += dt * 4;

    if (tool === 'nuke') action.projectile.rotation.x = Math.PI;
    if (tool === 'meteor' || tool === 'fire') {
      const trailColor = tool === 'meteor' ? 0xff6a27 : 0xffa32c;
      addParticle(
        action.projectile.position, trailColor,
        0.12 + Math.random() * 0.13,
        new THREE.Vector3(
          (Math.random() - 0.5) * 1.2,
          Math.random() * 1.1,
          (Math.random() - 0.5) * 1.2
        ),
        0.35 + Math.random() * 0.25,
        2
      );
    } else if (tool === 'bomb' || tool === 'nuke') {
      if (Math.random() > 0.45) {
        addParticle(
          action.projectile.position, 0x92959a, 0.12,
          new THREE.Vector3(
            (Math.random() - 0.5) * 1.1, 0.6,
            (Math.random() - 0.5) * 1.1
          ), 0.5, 1
        );
      }
    }

    if (tool === 'fire' && p >= 1 && !action.burning) {
      action.burning = true;
      action.burnStart = t;
      action.projectile.visible = false;
      playImpactSound('fire');
      for (let i = 0; i < 14; i++) {
        const flame = makeOrb(0xff6b22, 0.28 + Math.random() * 0.2, true);
        flame.position.set(
          action.target.x + (Math.random() - 0.5) * action.target.width,
          0.5 + Math.random() * 2,
          action.target.z + (Math.random() - 0.5) * action.target.depth
        );
        addActionNode(action, flame);
      }
    }

    if (tool === 'nuke' && p >= 1 && !action.impacted) {
      beginImpact(action);
      action.blast = addActionNode(action, makeOrb(0xffc65c, 1.2, true));
      action.blast.position.set(action.target.x, 2, action.target.z);
    } else if (tool !== 'fire' && tool !== 'nuke' && p >= 1 && !action.impacted) {
      beginImpact(action);
    }
    if (tool === 'fire' && action.burning) {
      action.nodes.slice(1).forEach((flame, index) => {
        flame.position.y += Math.sin(t * 15 + index) * dt * 1.8;
        flame.scale.setScalar(0.85 + Math.sin(t * 18 + index) * 0.18);
      });
      if (t - action.burnStart >= 0.62) beginImpact(action);
    }
    if (tool === 'nuke' && action.impacted) {
      updateWave(action, dt);
      if (action.blast) {
        const blastProgress = THREE.MathUtils.clamp(
          (t - action.impactTime) / 0.85, 0, 1
        );
        action.blast.scale.setScalar(1 + blastProgress * 12);
        action.blast.material.opacity = Math.max(0, 0.55 * (1 - blastProgress));
      }
    }
  } else if (tool === 'bat') {
    const p = THREE.MathUtils.clamp(t / 0.62, 0, 1);
    action.bat.rotation.z = -1.05 + Math.sin(p * Math.PI) * 2.15;
    action.bat.rotation.x = Math.sin(p * Math.PI) * 0.2;
    if (t >= 0.4 && !action.impacted) beginImpact(action);
  } else if (tool === 'laser') {
    const chargeProgress = THREE.MathUtils.clamp(t / 0.5, 0, 1);
    action.charge.position.set(
      action.target.x, 25 - chargeProgress * 2, action.target.z
    );
    action.charge.scale.setScalar(0.65 + chargeProgress * 0.65);
    action.beam.material.opacity = t > 0.48 ? 0.95 : 0.12 + chargeProgress * 0.25;
    if (t >= 0.58 && !action.impacted) beginImpact(action);
  } else if (tool === 'lightning') {
    const flash = t > 0.26 && t < 0.65;
    action.bolt.material.opacity = flash ? (Math.random() > 0.24 ? 1 : 0.15) : 0;
    if (t >= 0.43 && !action.impacted) beginImpact(action);
  } else if (tool === 'quake') {
    const progress = THREE.MathUtils.clamp(t / 1.35, 0, 1);
    action.waveRing.scale.setScalar(1 + progress * action.waveRadius);
    action.waveRing.material.opacity = 0.9 * (1 - progress * 0.75);
    if (t >= 0.18 && !action.impacted) beginImpact(action);
    if (action.impacted) updateWave(action, dt);
  } else if (tool === 'blackhole') {
    const progress = THREE.MathUtils.clamp(t / 1.35, 0, 1);
    const size = 0.9 + progress * 1.25;
    action.blackhole.scale.setScalar(size);
    action.ringA.rotation.z += dt * 2.2;
    action.ringB.rotation.y += dt * 1.7;
    action.ringA.scale.setScalar(0.7 + progress * 0.8);
    action.ringB.scale.setScalar(0.7 + progress * 0.8);
    if (!action.impacted) {
      buildings.forEach(building => {
        if (!building.alive || building.pending) return;
        const distance = Math.hypot(
          building.x - action.target.x, building.z - action.target.z
        );
        if (distance < action.waveRadius) {
          const pull = new THREE.Vector3(
            action.target.x - building.x, 0, action.target.z - building.z
          ).normalize();
          if (Math.random() > 0.985) {
            addParticle(
              new THREE.Vector3(building.x, 2 + Math.random() * 5, building.z),
              0x9b5cff, 0.11, pull.multiplyScalar(5), 0.7, -1
            );
          }
        }
      });
      if (t >= 1.38) beginImpact(action);
    }
  }

  if (t >= action.duration) {
    if (!action.impacted) beginImpact(action);
    if (tool === 'quake' || tool === 'nuke') {
      action.targets.forEach(building => {
        if (building.alive) collapseBuilding(building, tool);
      });
    }
    return true;
  }
  return false;
}

/* ---------------------- UI & input ---------------------- */
document.querySelectorAll('[data-tool]').forEach(button => {
  button.addEventListener('click', () => {
    const tool = button.dataset.tool;
    if (tool === 'reset') {
      resetCampus();
      return;
    }
    selectedTool = tool;
    document.querySelectorAll('[data-tool]').forEach(item => {
      item.classList.toggle('active', item === button);
    });
    toast(button.textContent + ' 선택');
  });
});

document.querySelector('#effectSize').addEventListener('input', event => {
  effectScale = Number(event.target.value) / 100;
  document.querySelector('#sizeLabel').textContent = event.target.value + '%';
});

let theta = 0.67;
let phi = 0.95;
let cameraRadius = 47;
function updateCamera() {
  camera.position.set(
    Math.sin(theta) * cameraRadius,
    Math.sin(phi) * cameraRadius * 0.72 + 5,
    Math.cos(theta) * cameraRadius
  );
  camera.lookAt(0, 2, 0);
}
updateCamera();

let pointerDown = null;
let dragging = false;
renderer.domElement.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  pointerDown = { x: event.clientX, y: event.clientY, id: event.pointerId };
  dragging = false;
  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener('pointermove', event => {
  if (!pointerDown) return;
  const dx = event.clientX - pointerDown.x;
  const dy = event.clientY - pointerDown.y;
  if (!dragging && Math.hypot(dx, dy) > 5) dragging = true;
  if (!dragging) return;
  theta -= dx * 0.006;
  phi = THREE.MathUtils.clamp(phi + dy * 0.004, 0.28, 1.42);
  pointerDown.x = event.clientX;
  pointerDown.y = event.clientY;
  updateCamera();
});

renderer.domElement.addEventListener('pointerup', event => {
  if (!pointerDown) return;
  const wasClick = !dragging && Math.hypot(
    event.clientX - pointerDown.x, event.clientY - pointerDown.y
  ) < 8;
  pointerDown = null;
  dragging = false;
  if (!wasClick || !gameStarted) return;

  const pointer = new THREE.Vector2(
    event.clientX / innerWidth * 2 - 1,
    -(event.clientY / innerHeight) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(
    buildings.filter(building => building.alive && !building.pending)
      .map(building => building.group),
    true
  );
  if (!hits.length) return;

  let object = hits[0].object;
  while (object && !object.userData.building) object = object.parent;
  const building = object?.userData.building;
  if (building) startAction(building, selectedTool);
});

renderer.domElement.addEventListener('pointercancel', () => {
  pointerDown = null;
  dragging = false;
});
renderer.domElement.addEventListener('contextmenu', event => event.preventDefault());
renderer.domElement.addEventListener('wheel', event => {
  cameraRadius = THREE.MathUtils.clamp(cameraRadius + event.deltaY * 0.035, 22, 75);
  updateCamera();
}, { passive: true });

/* ---------------------- Main loop ---------------------- */
const clock = new THREE.Clock();

function updateRubble(dt) {
  for (let i = rubble.length - 1; i >= 0; i--) {
    const item = rubble[i];
    item.life -= dt;
    item.velocity.y -= 18 * dt;
    item.mesh.position.addScaledVector(item.velocity, dt);
    item.mesh.rotation.x += item.spin.x * dt;
    item.mesh.rotation.y += item.spin.y * dt;
    item.mesh.rotation.z += item.spin.z * dt;

    if (item.mesh.position.y < 0.14) {
      item.mesh.position.y = 0.14;
      item.velocity.y *= -0.24;
      item.velocity.x *= 0.72;
      item.velocity.z *= 0.72;
    }
    if (item.life <= 0) {
      scene.remove(item.mesh);
      disposeTree(item.mesh);
      rubble.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const particle = particles[i];
    particle.life -= dt;
    particle.velocity.y -= particle.gravity * dt;
    particle.mesh.position.addScaledVector(particle.velocity, dt);
    particle.mesh.material.opacity = Math.max(0, particle.life / particle.maxLife);
    if (particle.life <= 0) {
      scene.remove(particle.mesh);
      disposeTree(particle.mesh);
      particles.splice(i, 1);
    }
  }
}

function updateTransients(dt) {
  for (let i = transients.length - 1; i >= 0; i--) {
    const item = transients[i];
    item.life -= dt;
    const progress = 1 - Math.max(0, item.life / item.maxLife);
    item.mesh.scale.setScalar(1 + progress * item.maxScale);
    if (item.mesh.material?.opacity !== undefined) {
      item.mesh.material.opacity = Math.max(0, 1 - progress);
    }
    if (item.life <= 0) {
      scene.remove(item.mesh);
      disposeTree(item.mesh);
      transients.splice(i, 1);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);

  for (let i = actions.length - 1; i >= 0; i--) {
    if (updateAction(actions[i], dt)) {
      removeAction(actions[i]);
      actions.splice(i, 1);
    }
  }
  updateRubble(dt);
  updateParticles(dt);
  updateTransients(dt);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script></body></html>
