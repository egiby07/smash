<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMASH — 우리 학교 부수기</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#9bc8df;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.panel{background:#101827dc;border:1px solid #ffffff24;border-radius:15px;padding:13px 17px;backdrop-filter:blur(12px);box-shadow:0 12px 35px #0003}.eyebrow{font-size:10px;letter-spacing:.2em;color:#67e8f9;font-weight:900}.brand{font-size:clamp(20px,3vw,30px);font-weight:950;letter-spacing:-.06em;margin-top:3px}.stats{display:flex;gap:24px}.label{font-size:10px;letter-spacing:.12em;color:#a9b6c9}.num{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}.tools{pointer-events:auto;display:flex;gap:7px;flex-wrap:wrap;max-width:680px}.tool{cursor:pointer;border:1px solid #ffffff24;border-radius:10px;padding:11px 14px;background:#101827e8;color:#d7e1ed;font-weight:800;font-size:13px}.tool.active{background:#67e8f9;color:#06202b;border-color:#67e8f9}.help{max-width:260px;font-size:12px;line-height:1.7}.toast{position:fixed;top:24%;left:50%;transform:translate(-50%,-8px);opacity:0;background:#111827ed;border:1px solid #ffffff24;border-radius:30px;padding:11px 18px;font-weight:800;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse,#152438aa,#050811ed);transition:.3s}#overlay.hidden{opacity:0;pointer-events:none}.intro{width:min(520px,100%);padding:38px;border:1px solid #ffffff24;border-radius:24px;background:#0c1422ed;text-align:center;box-shadow:0 30px 100px #0008}.intro h2{font-size:clamp(36px,7vw,58px);line-height:1;letter-spacing:-.07em;margin:16px 0}.intro p{color:#aab8cb;line-height:1.8;font-size:14px}.start{cursor:pointer;border:0;border-radius:12px;padding:14px 24px;background:#67e8f9;color:#06202b;font-weight:950;font-size:15px}.small{font-size:11px!important;color:#708096!important}@media(max-width:600px){.hud{padding:10px}.panel{padding:10px}.stats{gap:10px}.num{font-size:19px}.help{display:none}.tool{padding:9px 10px;font-size:12px}.intro{padding:26px}}
</style></head><body><div id="game"></div><div class="hud"><div class="top"><div class="panel"><div class="eyebrow">CAMPUS DESTRUCTION SIMULATOR</div><div class="brand">SMASH <span style="color:#67e8f9">/</span> 우리 학교 부수기</div></div><div class="panel stats"><div><div class="label">SCORE</div><div class="num" id="score">000000</div></div><div><div class="label">DESTROYED</div><div class="num" id="destroyed">0</div></div></div></div><div class="bottom"><div class="tools"><button class="tool active" data-tool="bomb">💥 폭탄</button><button class="tool" data-tool="bat">🏏 야구 배트</button><button class="tool" data-tool="laser">⚡ 레이저</button><button class="tool" data-tool="meteor">☄️ 운석</button><button class="tool" data-tool="reset">↻ 초기화</button></div><div class="panel help"><b>PLAY GUIDE</b><br>건물을 클릭해 부수세요.<br>마우스 드래그: 카메라 회전<br>마우스 휠: 줌 인 / 아웃</div></div></div><div id="toast" class="toast"></div>
<div id="overlay"><div class="intro"><div class="eyebrow">WELCOME TO YOUR CAMPUS</div><h2>오늘은<br><span style="color:#67e8f9">부수는 날.</span></h2><p>작은 3D 캠퍼스를 마음껏 파괴해 보세요.<br>도구를 바꾸고 최고 점수에 도전하세요.</p><button class="start" id="start">게임 시작하기 →</button><p class="small">가상의 캠퍼스를 사용하는 팬메이드 미니 게임입니다.</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8df);scene.fog=new THREE.Fog(0x9bc8df,45,110);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,220),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f6ff,0x54665d,2));const sun=new THREE.DirectionalLight(0xfff0d4,3);sun.position.set(-25,42,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
const material=(c,r=.82)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
box(140,.1,140,material(0x73966b),0,-.15,0).receiveShadow=true;box(100,.08,10,material(0x444e5a),0,-.04,0);box(10,.08,90,material(0x444e5a),0,-.02,0);
for(let i=-45;i<=45;i+=4){box(1.5,.012,.12,material(0xe6e6db),i,.02,0);box(.12,.012,1.5,material(0xe6e6db),0,.02,i)}
box(56,.08,3,material(0xb6b9b0),0,0,13);box(3,.08,46,material(0xb6b9b0),-14,0,0);box(38,.08,3,material(0xb6b9b0),13,0,-14);
for(const [x,z] of [[-20,-20],[-24,-12],[-21,8],[-20,18],[20,-20],[25,-10],[22,8],[20,18],[8,24],[-7,24],[27,22],[-28,25]]){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(.3,1.5,.3,material(0x6b4d35),0,.75,0,g);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),material(0x397657));crown.position.y=1.8;crown.castShadow=true;g.add(crown)}
const names=['중앙 도서관','학생회관','공학관 A','본관','강의동','체육관','과학관','기숙사'],places=[[-8,-9,7,6,9],[7,-10,8,6,13],[18,-7,7,6,7],[-22,-5,7,7,6],[-8,7,8,6,11],[7,8,7,7,8],[20,9,8,7,12],[-24,15,7,6,9],[-5,-23,10,7,10],[10,-24,7,6,6],[26,-23,6,7,8],[0,25,9,6,7]],colors=[0xd7dce1,0xc8d2d8,0xe4d6c4,0xc3d0c7,0xd8c5ba,0xbfcbd8,0xe0dfe1];
let buildings=[],debris=[],effects=[],score=0,destroyed=0,tool='bomb',started=false;
function createBuilding(p,i){const [x,z,w,d,h]=p,g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const body=box(w,h,d,material(colors[i%colors.length]),0,h/2,0,g),floors=Math.max(2,Math.floor(h/1.15));for(let y=0;y<floors;y++){const spacing=Math.max(1.1,w/Math.max(2,Math.floor(w/1.25)));for(let wx=-w/2+spacing/2;wx<w/2-.25;wx+=spacing){box(.48,.38,.05,material(0x4e7187),wx,.65+y*(h-.8)/floors,d/2+.03,g);box(.48,.38,.05,material(0x4e7187),wx,.65+y*(h-.8)/floors,-d/2-.03,g)}for(let wz=-d/2+1;wz<d/2;wz+=d/Math.max(1,Math.floor(d/1.7))){box(.05,.38,.48,material(0x4e7187),w/2+.03,.65+y*(h-.8)/floors,wz,g);box(.05,.38,.48,material(0x4e7187),-w/2-.03,.65+y*(h-.8)/floors,wz,g)}}box(w+.12,.22,d+.12,material(i%3===0?0x596875:0x777f87),0,h+.1,0,g);box(1.05,1.7,.08,material(0x384b58),0,.85,d/2+.06,g);const b={group:g,body,name:names[i%names.length],h,w,d,x,z,alive:true};g.userData.building=b;body.userData.building=b;buildings.push(b)}
function reset(){for(const b of buildings)scene.remove(b.group);buildings=[];for(const d of debris)scene.remove(d.mesh);debris=[];for(const e of effects)scene.remove(e.mesh);effects=[];score=0;destroyed=0;document.querySelector('#score').textContent='000000';document.querySelector('#destroyed').textContent='0';places.forEach(createBuilding);toast('캠퍼스가 복구되었습니다')}
places.forEach(createBuilding);
const scoreEl=document.querySelector('#score'),destroyedEl=document.querySelector('#destroyed'),toastEl=document.querySelector('#toast');function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>toastEl.classList.remove('show'),1400)}
function burst(pos,color,count,power){for(let i=0;i<count;i++){const size=.12+Math.random()*.28,m=new THREE.Mesh(new THREE.BoxGeometry(size,size,size),material(color));m.position.copy(pos);m.position.x+=(Math.random()-.5)*1.4;m.position.z+=(Math.random()-.5)*1.4;m.castShadow=true;scene.add(m);debris.push({mesh:m,v:new THREE.Vector3((Math.random()-.5)*power,Math.random()*power*.85+2,(Math.random()-.5)*power),life:1.6+Math.random()*1.4,spin:new THREE.Vector3(Math.random()*7,Math.random()*7,Math.random()*7)})}}
function destroy(b,t){if(!b||!b.alive)return;b.alive=false;scene.remove(b.group);buildings.splice(buildings.indexOf(b),1);destroyed++;const points={bomb:100,bat:150,laser:200,meteor:300}[t]||100;score+=points;scoreEl.textContent=String(score).padStart(6,'0');destroyedEl.textContent=destroyed;const pos=new THREE.Vector3(b.x,b.h*.45,b.z),color=t==='laser'?0x67e8f9:t==='meteor'?0xff5e43:0xffb45c;burst(pos,color,t==='meteor'?55:t==='bomb'?34:t==='bat'?20:25,t==='meteor'?13:t==='bat'?6:9);const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.075,8,40),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9}));ring.rotation.x=Math.PI/2;ring.position.set(b.x,.1,b.z);scene.add(ring);effects.push({mesh:ring,life:.55,max:.55,kind:'ring'});if(t==='laser'){const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([camera.position.clone(),pos]),new THREE.LineBasicMaterial({color:0x67e8f9,transparent:true}));scene.add(line);effects.push({mesh:line,life:.22,max:.22,kind:'beam'})}if(t==='meteor'){const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,1),material(0x57443e));rock.position.set(b.x,b.h+12,b.z);scene.add(rock);effects.push({mesh:rock,life:.3,max:.3,kind:'meteor'})}toast(b.name+' 파괴! +'+points+'점')}
document.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{const t=btn.dataset.tool;if(t==='reset'){reset();return}tool=t;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===btn));toast(btn.textContent+' 선택')}));
document.querySelector('#start').addEventListener('click',()=>{started=true;document.querySelector('#overlay').classList.add('hidden');toast('건물을 클릭해 파괴해 보세요!')});
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(!started||e.button!==0)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(buildings.map(b=>b.group),true);if(!hits.length)return;let o=hits[0].object;while(o&&!o.userData.building)o=o.parent;const b=o?.userData.building;if(!b)return;if(tool==='bomb')buildings.filter(x=>Math.hypot(x.x-b.x,x.z-b.z)<7).slice().forEach(x=>destroy(x,'bomb'));else if(tool==='bat')buildings.filter(x=>Math.hypot(x.x-b.x,x.z-b.z)<5.8).slice(0,2).forEach(x=>destroy(x,'bat'));else destroy(b,tool)});
let dragging=false,lastX=0,lastY=0,theta=.67,phi=.95,radius=47;function updateCamera(){camera.position.set(Math.sin(theta)*radius,Math.sin(phi)*radius*.72+5,Math.cos(theta)*radius);camera.lookAt(0,2,0)}updateCamera();renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===2||e.shiftKey){dragging=true;lastX=e.clientX;lastY=e.clientY}});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-lastX)*.006;phi=Math.max(.28,Math.min(1.42,phi+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY;updateCamera()});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(22,Math.min(75,radius+e.deltaY*.035));updateCamera()},{passive:true});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.life-=dt;d.v.y-=18*dt;d.mesh.position.addScaledVector(d.v,dt);d.mesh.rotation.x+=d.spin.x*dt;d.mesh.rotation.y+=d.spin.y*dt;if(d.mesh.position.y<.13){d.mesh.position.y=.13;d.v.y*=-.24;d.v.x*=.72;d.v.z*=.72}if(d.life<=0){scene.remove(d.mesh);d.mesh.geometry.dispose();d.mesh.material.dispose();debris.splice(i,1)}}for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;if(e.kind==='ring'){const p=1-e.life/e.max;e.mesh.scale.setScalar(1+p*13);e.mesh.material.opacity=Math.max(0,e.life/e.max)}else if(e.kind==='meteor'){e.mesh.position.y-=42*dt;e.mesh.rotation.x+=dt*8}else if(e.kind==='beam')e.mesh.material.opacity=Math.max(0,e.life/e.max);if(e.life<=0){scene.remove(e.mesh);e.mesh.geometry.dispose();if(e.mesh.material.dispose)e.mesh.material.dispose();effects.splice(i,1)}}renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script></body></html>
